<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Sherwin Laoshi</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        :root {
            --primary: #8B1A1A;
            --gold: #C9A84C;
            --bg: #FDFCF8;
            --text: #2C2C2C;
            --text-light: #5A5A5A;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px;
        }
        .content h1 {
            font-size: 5rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
        }
        .content p {
            font-size: 1.1rem;
            color: var(--text-light);
            margin: 16px 0 32px;
        }
        .content a {
            display: inline-block;
            padding: 14px 32px;
            background: var(--primary);
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        .content a:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="content">
        <h1>404</h1>
        <p>The page you are looking for does not exist. Please return to the homepage.</p>
        <a href="/">Back to Homepage</a>
    </div>
</body>
</html>
