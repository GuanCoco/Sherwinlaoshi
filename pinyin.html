<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Chinese Pinyin Annotator">
    <title>Chinese Pinyin Annotator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

    <header class="hd">
        <h1 class="tt">
            <span class="cn">中文注音工具</span>
            <span class="en">Chinese Pinyin Annotator</span>
        </h1>
        <p class="sub">Paste Chinese text, get pinyin, click any word for definitions &amp; pronunciation</p>
    </header>

    <main class="mc">

        <!-- Input -->
        <section class="card in-card">
            <div class="in-hd">
                <h2 class="lbl">Input Text</h2>
                <div class="acts">
                    <button class="bt bo sm" id="btnExample" title="Load example">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9 9a3 3 0 015.8 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                        Example
                    </button>
                    <button class="bt bo sm" id="btnClear" title="Clear">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
                        Clear
                    </button>
                </div>
            </div>
            <textarea id="textInput" class="ta" placeholder="Paste or type Chinese text here…&#10;例如：今天天气真好，我想出去散步。" rows="5"></textarea>
            <div class="in-ft">
                <span class="cc" id="charCount">0 chars</span>
                <button class="bt bp" id="btnAnnotate">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                    Add Pinyin
                </button>
            </div>
        </section>

        <!-- Dict status -->
        <div class="ds" id="dictStatus">
            <div class="ds-bar"><div class="ds-fill" id="dictPct" style="width:0"></div></div>
            <span class="ds-msg" id="dictMsg">Initializing…</span>
        </div>

        <!-- Output -->
        <section class="card out-card" id="outputSection" style="display:none">
            <div class="out-hd">
                <h2 class="lbl">Annotated Text</h2>
                <div class="acts">
                    <!-- Font slider -->
                    <div class="fs">
                        <span class="fsl">A</span>
                        <input type="range" class="fsr" id="fontSlider" min="100" max="250" value="100" step="5">
                        <span class="fsl fsl-lg">A</span>
                        <span class="fsv" id="fontSliderVal">100%</span>
                    </div>
                    <!-- Tone color toggle -->
                    <label class="tct" title="Disable tone colors">
                        <input type="checkbox" id="toneToggle">
                        <span>Colors</span>
                    </label>
                    <!-- Tone legend -->
                    <span class="tl">
                        <i class="td t1"></i>1st
                        <i class="td t2"></i>2nd
                        <i class="td t3"></i>3rd
                        <i class="td t4"></i>4th
                        <i class="td t5"></i>neutral
                    </span>
                    <!-- Copy buttons -->
                    <button class="bt bo sm" id="btnCopyPinyin" title="Copy pinyin only">Copy Pinyin</button>
                    <button class="bt bo sm" id="btnCopyHanzi" title="Copy full text">Copy Text</button>
                </div>
            </div>
            <div class="at" id="annotatedText"></div>
        </section>

        <!-- Empty state -->
        <section class="es" id="emptyState">
            <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" opacity="0.35">
                <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/>
            </svg>
            <p>Type Chinese text above and click <strong>Add Pinyin</strong></p>
            <p class="eh">Tip: Click any word to see definitions &amp; pronunciation</p>
        </section>

    </main>
</div>

<!-- Popover -->
<div class="pop" id="popover" role="tooltip">
    <div class="ph">
        <span class="pw" id="popoverWord"></span>
        <div class="pa">
            <button class="ps" id="popoverSpeak" title="Pronounce">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                    <path d="M19.07 4.93a10 10 0 010 14.14"/>
                    <path d="M15.54 8.46a5 5 0 010 7.07"/>
                </svg>
            </button>
            <button class="pc" id="popoverClose" aria-label="Close">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
    </div>
    <div class="pp" id="popoverPinyin"></div>
    <div class="pd"></div>
    <div class="defs" id="popoverDefs"></div>
</div>
<div class="pbd" id="popoverBackdrop"></div>

<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.27.0/dist/index.js"></script>
<script src="js/main.js"></script>
</body>
</html>
