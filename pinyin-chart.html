<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Complete Pinyin Chart — click any syllable to hear pronunciation">
    <title>Pinyin Chart | sherwinlaoshi</title>
    <link rel="canonical" href="https://sherwinlaoshi.com/pinyin-chart.html">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .chart-wrap {
            margin: 0 auto;
            padding: 16px 12px 40px;
        }
        .chart-hd {
            text-align: center;
            padding: 24px 0 16px;
        }
        .chart-hd h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 4px; }
        .chart-hd p { font-size: .88rem; color: var(--c-text3); }
        .chart-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: var(--r-lg);
            box-shadow: var(--sh-md);
            border: 1px solid #c5d1dd;
        }

        /* ---- Table base ---- */
        .py-table {
            border-collapse: collapse;
            font-size: .84rem;
            white-space: nowrap;
            min-width: 100%;
            background: #fff;
        }

        /* ---- Header row (dark blue bar) ---- */
        .py-table .hd-row th {
            padding: 10px 7px;
            font-weight: 700;
            color: #fff;
            border: none;
            vertical-align: middle;
        }
        .py-table .hd-title {
            background: #1b5e9f;
            position: relative;
            width: 80px;
            min-width: 80px;
            height: 64px;
            overflow: hidden;
        }
        .py-table .hd-diag-line {
            position: absolute;
            top: -1px; left: -1px; right: -1px; bottom: -1px;
            background: linear-gradient(45deg,
                transparent 46%,
                rgba(255,255,255,0.45) 46%,
                rgba(255,255,255,0.45) 54%,
                transparent 54%);
            pointer-events: none;
        }
        .py-table .hd-diag-top {
            position: absolute;
            top: 10px; right: 9px;
            color: #fff;
            font-size: .72rem;
            font-weight: 600;
            text-align: right;
            line-height: 1.3;
        }
        .py-table .hd-diag-bot {
            position: absolute;
            bottom: 10px; left: 9px;
            color: #fff;
            font-size: .72rem;
            font-weight: 600;
            text-align: left;
            line-height: 1.3;
        }
        .py-table .hd-init {
            background: #1b5e9f;
            font-size: .85rem;
            min-width: 42px;
            text-align: center;
        }

        /* ---- Column header sub-rows ---- */
        .py-table .sub-hd th {
            padding: 6px 7px;
            font-weight: 600;
            font-size: .82rem;
            border-bottom: 1px solid #1b5e9f;
            border-right: 1px solid #e0e6ec;
            text-align: center;
            color: #333;
            background: #f0f4f8;
        }

        /* zh/ch/sh/r and z/c/s — same blue as standard initials */
        .py-table th.orange-hd,
        .py-table th.green-hd {
            background: #1b5e9f !important;
            color: #fff !important;
            border-color: #1b5e9f;
        }

        /* ---- Row label (final) cell ---- */
        .py-table td.final-cell,
        .py-table th.final-cell {
            padding: 5px 8px;
            font-weight: 600;
            font-size: .83rem;
            border-right: 1px solid #1b5e9f;
            border-bottom: 1px solid #e8eef3;
            text-align: center;
            background: #fff;
            color: #333;
            min-width: 44px;
            position: sticky;
            left: 0;
            z-index: 2;
        }
        /* Blue group labels */
        .py-table td.final-blue,
        .py-table th.final-blue {
            background: #fff;
        }

        /* ---- Data cells ---- */
        .py-table td.py-cell {
            padding: 5px 7px;
            text-align: center;
            cursor: pointer;
            color: #333;
            font-weight: 400;
            border-right: 1px solid #edf2f7;
            border-bottom: 1px solid #e8eef3;
            transition: background .12s ease, color .12s ease;
        }
        .py-table td.py-cell:hover {
            background: #e8f0fe;
            color: #1b5e9f;
        }
        .py-table td.py-cell.playing {
            background: #1b5e9f;
            color: #fff;
            animation: cellPop .3s ease;
        }
        @keyframes cellPop {
            0%   { transform: scale(1); }
            50%  { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        .py-table td.empty-cell {
            background: transparent;
            cursor: default;
            border-right: 1px solid #f5f7fa;
            border-bottom: 1px solid #e8eef3;
        }

        /* ---- Blue highlight for y-/w- initial syllables ---- */
        .py-table td.py-highlight {
            background: #dce6f2 !important;
            font-weight: 600;
        }
        .py-table td.py-highlight:hover {
            background: #c5d9ed !important;
        }
        .py-table td.py-highlight.playing {
            background: #1b5e9f !important;
            color: #fff;
        }

        /* ---- Orange column cells (zh/ch/sh/r) with blue border ---- */
        .py-table td.py-orange {
            background: #fde8d8 !important;
            border-left: 1px solid #1b5e9f;
            border-right: 1px solid #1b5e9f;
        }
        .py-table td.py-orange:hover {
            background: #fad2b0 !important;
        }
        .py-table td.py-orange.playing {
            background: #1b5e9f !important;
            color: #fff;
        }

        /* ---- Green column cells (z/c/s) with blue border ---- */
        .py-table td.py-green {
            background: #e4f2dc !important;
            border-left: 1px solid #1b5e9f;
            border-right: 1px solid #1b5e9f;
        }
        .py-table td.py-green:hover {
            background: #cae6b8 !important;
        }
        .py-table td.py-green.playing {
            background: #1b5e9f !important;
            color: #fff;
        }

        /* ---- Group separator borders (thick) ---- */
        .py-table th.sep,
        .py-table td.sep {
            border-left: 2px solid #1b5e9f !important;
        }
        /* Ensure separator shows on empty cells too */
        .py-table td.empty-cell.sep {
            border-left: 2px solid #1b5e9f !important;
        }
        /* Row group separator (thick bottom border) */
        .py-table tr.group-end td,
        .py-table tr.group-end th {
            border-bottom: 2px solid #1b5e9f;
        }

        /* Dashed big box */
        .py-table td.dashed-left { border-left: 2px dashed #1b5e9f !important; }
        .py-table td.dashed-right { border-right: 2px dashed #1b5e9f !important; }
        .py-table td.dashed-top { border-top: 2px dashed #1b5e9f !important; }
        .py-table td.dashed-bottom { border-bottom: 2px dashed #1b5e9f !important; }

        /* ---- Striping for readability ---- */
        .py-table tr:nth-child(even) td.py-cell:not(.playing) {
            background: #fafbfd;
        }
        .py-table tr:nth-child(even) td.py-cell:hover {
            background: #e8f0fe;
        }

        /* ---- Legend ---- */
        .chart-info {
            margin-top: 14px;
            font-size: .78rem;
            color: var(--c-text3);
            text-align: center;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .legend-dot {
            width: 12px; height: 12px;
            border-radius: 3px;
            display: inline-block;
        }

        @media (max-width: 720px) {
            .py-table { font-size: .76rem; }
            .py-table .hd-init { font-size: .76rem; min-width: 36px; padding: 8px 4px; }
            .py-table td.final-cell, .py-table th.final-cell { min-width: 36px; font-size: .76rem; padding: 4px 5px; }
            .py-table td.py-cell { font-size: .74rem; padding: 4px 4px; }
            .chart-wrap { padding: 10px 6px 28px; }
        }
    </style>
</head>

/* ================================================================
   Syllables that get blue background highlight
   ================================================================ */
var BLUE_HIGHLIGHT = new Set([
    'yi','ye','yin','ying',
    'wu',
    'yu','yue','yuan','yun'
]);

/* Syllables that get orange highlight + blue border: zhi/chi/shi/ri */
var ORANGE_SYLS = new Set(['zhi','chi','shi','ri']);
/* Syllables that get green highlight + blue border: zi/ci/si */
var GREEN_SYLS = new Set(['zi','ci','si']);
/* Group separator columns: f|d, l|g, h|j, x|zh, r|z */
var SEP_COLS = new Set([5,9,12,15,19]);

/* Row indices that mark group end (thick bottom border) */
var GROUP_END_ROWS = new Set([10,20,28]); // er, iong, uang
/* Dashed big boxes:
   Left box: col 0 (∅), rows 11-32 (i to ün)
   Right box: cols 22-23 (y,w), rows 11-32 (i to ün) */
var DASHED_BOX_START_ROW = 11; // i row
var DASHED_BOX_END_ROW = 32;   // ün row
var DASHED_BOX_LEFT_COL = 0;   // ∅ column
var DASHED_BOX_RIGHT_START_COL = 22; // y column
var DASHED_BOX_RIGHT_END_COL = 23;   // w column

/* ================================================================
   Render table body
   ================================================================ */
function buildTable() {
    var tbody = document.getElementById('pyBody');
    for (var r = 0; r < ROWS.length; r++) {
        var row = ROWS[r];
        var tr = document.createElement('tr');
        if (GROUP_END_ROWS.has(r)) {
            tr.className = 'group-end';
        }

        // Final label cell
        var fd = document.createElement('td');
        fd.className = row[1] ? 'final-cell final-blue' : 'final-cell';
        fd.textContent = row[0];
        tr.appendChild(fd);

        // Data cells
        var cells = row[2];
        for (var c = 0; c < cells.length; c++) {
            var td = document.createElement('td');
            var inRange = (r >= DASHED_BOX_START_ROW && r <= DASHED_BOX_END_ROW);
            // Determine if this cell is in left box (col 0) or right box (cols 22-23)
            var inLeftBox = inRange && c == DASHED_BOX_LEFT_COL;
            var inRightBoxStart = inRange && c == DASHED_BOX_RIGHT_START_COL;
            var inRightBoxEnd = inRange && c == DASHED_BOX_RIGHT_END_COL;
            var isTopRow = r == DASHED_BOX_START_ROW;
            var isBottomRow = r == DASHED_BOX_END_ROW;

            if (cells[c]) {
                var cls = 'py-cell';
                if (SEP_COLS.has(c)) cls += ' sep';
                if (BLUE_HIGHLIGHT.has(cells[c])) cls += ' py-highlight';
                if (ORANGE_SYLS.has(cells[c])) cls += ' py-orange';
                if (GREEN_SYLS.has(cells[c])) cls += ' py-green';
                // Dashed boxes
                if (inLeftBox) {
                    cls += ' dashed-left dashed-right';
                    if (isTopRow) cls += ' dashed-top';
                    if (isBottomRow) cls += ' dashed-bottom';
                }
                if (inRightBoxStart) {
                    cls += ' dashed-left';
                    if (isTopRow) cls += ' dashed-top';
                    if (isBottomRow) cls += ' dashed-bottom';
                }
                if (inRightBoxEnd) {
                    cls += ' dashed-right';
                    if (isTopRow) cls += ' dashed-top';
                    if (isBottomRow) cls += ' dashed-bottom';
                }
                td.className = cls;
                td.textContent = cells[c];
                td.setAttribute('data-syl', cells[c]);
                td.addEventListener('click', onCellClick);
                td.addEventListener('touchend', function(e) {
                    e.preventDefault(); this.click();
                });
            } else {
                td.className = 'empty-cell';
                if (SEP_COLS.has(c)) td.className += ' sep';
                // Dashed boxes for empty cells
                if (inLeftBox) {
                    td.className += ' dashed-left dashed-right';
                    if (isTopRow) td.className += ' dashed-top';
                    if (isBottomRow) td.className += ' dashed-bottom';
                }
                if (inRightBoxStart) {
                    td.className += ' dashed-left';
                    if (isTopRow) td.className += ' dashed-top';
                    if (isBottomRow) td.className += ' dashed-bottom';
                }
                if (inRightBoxEnd) {
                    td.className += ' dashed-right';
                    if (isTopRow) td.className += ' dashed-top';
                    if (isBottomRow) td.className += ' dashed-bottom';
                }
            }
            tr.appendChild(td);
        }
        tbody.appendChild(tr);
    }
}

var _playing = null;

/* ── Multi-engine TTS ── */
function edgeFetch(text) {
    var ssml = '<speak version="1.0" xml:lang="zh-CN"><voice name="zh-CN-XiaoxiaoNeural">' + text + '</voice></speak>';
    return fetch('https://speech.platform.bing.com/consumer/speech/synthesize/readaloud/edge/v1?TrustedClientToken=6A5AA1D4EAFF4E9FB37E23D68491D6F4', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/ssml+xml',
            'X-Microsoft-OutputFormat': 'audio-16khz-32kbitrate-mono-mp3'
        },
        body: ssml
    }).then(function(r) { return r.ok ? r.blob().then(function(b) { return URL.createObjectURL(b); }) : null; })
      .catch(function() { return null; });
}

function tryGoogleURL(audio, text) {
    audio.src = 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=zh-CN&q=' + encodeURIComponent(text);
    audio.play().catch(function() {});
}

function onCellClick(e) {
    var td = e.currentTarget;
    var syl = td.getAttribute('data-syl');
    if (!syl) return;

    if (_playing) _playing.classList.remove('playing');
    _playing = td;
    td.classList.add('playing');
    setTimeout(function() { td.classList.remove('playing'); }, 800);

    var sylv = syl.replace(/ü/g,'v').replace(/Ü/g,'V');
    var query = CHAR_MAP[sylv] || CHAR_MAP[syl] || syl;
    var audio = new Audio();
    audio.preload = 'auto';

    edgeFetch(query).then(function(blobUrl) {
        if (blobUrl) {
            audio.src = blobUrl;
            audio.play().catch(function() { tryGoogleURL(audio, query); });
        } else {
            tryGoogleURL(audio, query);
        }
    });
}
