<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive Pinyin Chart — click any syllable to hear pronunciation">
    <title>Pinyin Chart | sherwinlaoshi</title>
    <link rel="canonical" href="https://sherwinlaoshi.com/pinyin-chart.html">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .chart-wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 16px 12px 40px;
        }
        .chart-hd {
            text-align: center;
            padding: 24px 0 12px;
        }
        .chart-hd h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 4px; }
        .chart-hd p { font-size: .88rem; color: var(--c-text3); }
        .chart-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: var(--r-lg);
            box-shadow: 0 1px 3px rgba(0,0,0,.06);
            border: 1px solid var(--c-border2);
            background: var(--c-surface);
        }
        table.chart {
            border-collapse: collapse;
            font-size: .85rem;
            white-space: nowrap;
            min-width: 100%;
        }
        table.chart th,
        table.chart td {
            padding: 6px 8px;
            text-align: center;
            min-width: 42px;
            border-bottom: 1px solid #f0f0f0;
        }
        /* Row header (final label) */
        table.chart th.rl {
            position: sticky;
            left: 0;
            background: #f8f9fb;
            z-index: 2;
            font-weight: 600;
            color: var(--c-primary);
            border-right: 1px solid var(--c-border);
            min-width: 44px;
            font-size: .9rem;
        }
        /* Column headers */
        table.chart th.ch {
            background: var(--c-surface);
            color: var(--c-text2);
            font-weight: 600;
            font-size: .82rem;
            position: sticky;
            top: 0;
            z-index: 1;
            border-bottom: 2px solid var(--c-border);
        }
        /* Group header row */
        table.chart th.gr {
            background: #f0f3ff;
            color: var(--c-primary);
            font-weight: 700;
            font-size: .82rem;
            text-align: left;
            padding: 8px 14px;
            border-bottom: 2px solid var(--c-border);
            border-top: 1px solid var(--c-border);
            position: sticky;
            left: 0;
            z-index: 2;
        }
        /* Cells */
        table.chart td.cell {
            cursor: pointer;
            color: var(--c-text);
            font-weight: 500;
            transition: all .12s;
            border-radius: 4px;
            position: relative;
        }
        table.chart td.cell:hover {
            background: var(--c-primary-l);
            color: var(--c-primary);
        }
        table.chart td.cell.playing {
            background: var(--c-primary);
            color: #fff;
            animation: cellPop .3s ease;
        }
        @keyframes cellPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        table.chart td.empty {
            background: transparent;
            cursor: default;
        }
        /* Legend */
        .chart-info {
            margin-top: 12px;
            font-size: .8rem;
            color: var(--c-text3);
            text-align: center;
        }

        @media (max-width: 600px) {
            table.chart { font-size: .78rem; }
            table.chart th.rl { min-width: 36px; font-size: .8rem; }
            table.chart th.ch { font-size: .72rem; padding: 4px 5px; min-width: 36px; }
            table.chart td { padding: 4px 5px; min-width: 36px; }
        }
    </style>
</head>

/* ================================================================
   Tone mark utility
   ================================================================ */
function num2mark(syl) {
    var marks = {
        a: ['a','ā','á','ǎ','à','a'], e: ['e','ē','é','ě','è','e'],
        i: ['i','ī','í','ǐ','ì','i'], o: ['o','ō','ó','ǒ','ò','o'],
        u: ['u','ū','ú','ǔ','ù','u'], v: ['ü','ǖ','ǘ','ǚ','ǜ','ü']
    };
    var m = /^([a-zA-Z:]+)([1-5])$/.exec(syl);
    if (!m) return syl.toLowerCase().replace(/v/g, 'ü');
    var v = m[1], t = parseInt(m[2]);
    var lv = v.toLowerCase();
    var ti = 0;
    if (lv.indexOf('a') !== -1) ti = lv.indexOf('a');
    else if (lv.indexOf('e') !== -1) ti = lv.indexOf('e');
    else if (lv.indexOf('ou') !== -1) ti = lv.indexOf('o');
    else ti = Math.min(1, lv.length - 1);
    var target = lv[ti];
    if (!marks[target]) return v.toLowerCase().replace(/v/g, 'ü');
    var mc = marks[target][t];
    var r = '';
    for (var i = 0; i < v.length; i++) {
        r += i === ti ? mc : v[i];
    }
    return r.replace(/v/g, 'ü');
}

function toMarked(raw) {
    return raw.split(/\s+/).map(num2mark).join('');
}

function buildTable() {
    var head = document.getElementById('chartHead');
    var body = document.getElementById('chartBody');
    var htr = document.createElement('tr');
    // First header cell for row labels
    var th = document.createElement('th'); th.className = 'ch'; th.textContent = 'Final'; htr.appendChild(th);
    for (var i = 0; i < INITIALS.length; i++) {
        th = document.createElement('th'); th.className = 'ch';
        th.textContent = INITIALS[i] === '' ? '∅' : INITIALS[i];
        htr.appendChild(th);
    }
    head.appendChild(htr);

    for (var g = 0; g < GROUPS.length; g++) {
        var group = GROUPS[g];
        // Group header row
        var gr = document.createElement('tr');
        var gth = document.createElement('th'); gth.className = 'gr';
        gth.setAttribute('colspan', INITIALS.length + 1);
        gth.textContent = group.label;
        gr.appendChild(gth);
        body.appendChild(gr);

        for (var r = 0; r < group.rows.length; r++) {
            var row = group.rows[r];
            var tr = document.createElement('tr');
            // Row label
            var rl = document.createElement('th'); rl.className = 'rl';
            rl.textContent = row.l;
            tr.appendChild(rl);

            for (var c = 0; c < INITIALS.length; c++) {
                var ini = INITIALS[c];
                var td = document.createElement('td');
                var cell = row.c[ini];
                if (cell) {
                    td.className = 'cell';
                    td.textContent = cell.m;
                    td.title = cell.m;
                    td.setAttribute('data-syl', cell.m);
                    td.addEventListener('click', onCellClick);
                    td.addEventListener('touchend', function(e) {
                        e.preventDefault(); this.click();
                    });
                } else {
                    td.className = 'empty';
                    td.textContent = '';
                }
                tr.appendChild(td);
            }
            body.appendChild(tr);
        }
    }
}

var _playing = null;

/* ── Multi-engine TTS (Android-compatible) ── */

function edgeFetch(text) {
    var ssml = '<speak version="1.0" xml:lang="zh-CN"><voice name="zh-CN-XiaoxiaoNeural">' + text + '</voice></speak>';
    return fetch('https://speech.platform.bing.com/consumer/speech/synthesize/readaloud/edge/v1?TrustedClientToken=6A5AA1D4EAFF4E9FB37E23D68491D6F4', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/ssml+xml',
            'X-Microsoft-OutputFormat': 'audio-16khz-32kbitrate-mono-mp3'
        },
        body: ssml
    }).then(function(r) { return r.ok ? r.blob().then(function(b) { return URL.createObjectURL(b); }) : null; })
      .catch(function() { return null; });
}

function tryGoogleURL(audio, text) {
    audio.src = 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=zh-CN&q=' + encodeURIComponent(text);
    audio.play().catch(function() { /* silent */ });
}

function tryWebTTS(text) {
    if ('speechSynthesis' in window) {
        speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'zh-CN'; u.rate = 0.8;
        speechSynthesis.speak(u);
    }
}

function onCellClick(e) {
    var td = e.currentTarget;
    var syl = td.getAttribute('data-syl');
    if (!syl) return;

    if (_playing) _playing.classList.remove('playing');
    _playing = td;
    td.classList.add('playing');
    setTimeout(function() { td.classList.remove('playing'); }, 800);

    var query = CHAR[syl] || syl;

    // Pre-create Audio inside click for Android gesture permission
    var audio = new Audio();
    audio.preload = 'auto';

    // Engine 1: Microsoft Edge TTS
    edgeFetch(query).then(function(blobUrl) {
        if (blobUrl) {
            audio.src = blobUrl;
            audio.play().catch(function() { tryGoogleURL(audio, query); });
        } else {
            // Engine 2: Google TTS (works with VPN)
            tryGoogleURL(audio, query);
        }
    });
}
